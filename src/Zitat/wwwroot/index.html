<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Zitat</title>
    <link rel="stylesheet" href="/zitat.css">
  </head>
  <body>
    <header>
      <form id="filters">
        <div class="brand">Zitat</div>
        <div class="search-area">
          <div class="search-line">
            <input id="search" name="q" type="search" autocomplete="off"
              aria-label="Search logs" aria-controls="suggestions"
              placeholder="e.g. severity:err since:now-30m">
            <button id="syntax-toggle" type="button" aria-label="Search syntax"
              aria-expanded="false" aria-controls="syntax-help">?</button>
          </div>
          <div id="suggestions" role="listbox" hidden></div>
          <div id="syntax-help" hidden>
            <strong>Search syntax</strong>
            <dl>
              <div><dt><code>host:iron</code></dt><dd>Exact host</dd></div>
              <div><dt><code>app:sshd</code></dt><dd>Application</dd></div>
              <div><dt><code>severity:&lt;=err</code></dt><dd>Error or more severe</dd></div>
              <div><dt><code>facility:auth</code></dt><dd>Journal facility</dd></div>
              <div><dt><code>since:now-30m</code></dt><dd>Start time, inclusive</dd></div>
              <div><dt><code>until:2026-09-21</code></dt><dd>End time, exclusive</dd></div>
            </dl>
            <a href="/search-reference.html">Full search reference</a>
          </div>
        </div>
        <button type="submit" aria-label="Search">⌕</button>
        <button id="live" type="button" disabled
          aria-label="Pause live updates">⏯</button>
      </form>
      <div id="search-error" role="alert" hidden></div>
      <div id="effective-range" hidden></div>
      <div id="progress" hidden></div>
    </header>
    <main>
      <div id="empty" hidden>No matching logs.</div>
      <ol id="logs" aria-live="polite"></ol>
      <button id="older" type="button" hidden>Load older</button>
    </main>
    <div id="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="notice-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
    <template id="row">
      <li>
        <button class="toggle" type="button" aria-expanded="false"
          aria-label="Show all journal fields">▸</button>
        <time></time>
        <button class="host field"></button>
        <button class="app field"></button>
        <button class="unit field"></button>
        <button class="facility field"></button>
        <button class="severity field"></button>
        <span class="message"></span>
        <dl class="details" hidden></dl>
      </li>
    </template>
    <script src="/zitat.js"></script>
  </body>
</html>

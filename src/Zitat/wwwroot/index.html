<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Zitat</title>
    <link rel="stylesheet" href="/zitat.css">
  </head>
  <body>
    <header>
      <form id="filters">
        <div class="brand">Zitat</div>
        <input id="search" name="q" type="search"
          placeholder="Search logs; host:, app:, unit:, source:, boot:, facility:, severity:, since:, until:">
        <button type="submit">Search</button>
        <button id="live" type="button" disabled
          aria-label="Pause live updates">⏯</button>
      </form>
      <div id="notice" role="status"></div>
    </header>
    <main>
      <div id="empty" hidden>No matching logs.</div>
      <ol id="logs" aria-live="polite"></ol>
      <button id="older" type="button">Load older</button>
    </main>
    <template id="row">
      <li>
        <time></time>
        <button class="host field"></button>
        <button class="app field"></button>
        <button class="unit field"></button>
        <button class="facility field"></button>
        <button class="severity field"></button>
        <span class="message"></span>
      </li>
    </template>
    <script src="/zitat.js"></script>
  </body>
</html>

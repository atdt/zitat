<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zitat</title>
  <link rel="stylesheet" href="/zitat.css">
</head>
<body>
  <header>
    <div class="brand">Zitat <span>syslog</span></div>
    <form id="filters">
      <input id="search" name="q" type="search"
             placeholder="Search or use host:, app:, facility:, severity:">
      <input id="host" name="host" class="short" placeholder="Host">
      <input id="app" name="app" class="short" placeholder="Application">
      <select id="facility" name="facility" aria-label="Facility">
        <option value="">Any facility</option>
      </select>
      <select id="severity" name="severity" aria-label="Severity">
        <option value="">Any severity</option>
        <option value="0">Emergency</option>
        <option value="1">Alert</option>
        <option value="2">Critical</option>
        <option value="3">Error</option>
        <option value="4">Warning</option>
        <option value="5">Notice</option>
        <option value="6">Info</option>
        <option value="7">Debug</option>
      </select>
      <select id="range" name="range" aria-label="Time range">
        <option value="15m">Last 15 minutes</option>
        <option value="1h" selected>Last hour</option>
        <option value="6h">Last 6 hours</option>
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
        <option value="">All retained logs</option>
      </select>
      <button type="submit">Search</button>
      <button id="live" type="button">Pause</button>
    </form>
    <div id="notice" role="status"></div>
  </header>
  <main>
    <div id="empty">No matching logs.</div>
    <ol id="logs" aria-live="polite"></ol>
    <button id="older" type="button">Load older</button>
  </main>
  <template id="row">
    <li>
      <time></time>
      <button class="host field"></button>
      <button class="app field"></button>
      <button class="facility field"></button>
      <button class="severity field"></button>
      <span class="message"></span>
    </li>
  </template>
  <script src="/zitat.js"></script>
</body>
</html>

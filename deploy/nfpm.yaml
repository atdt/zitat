# Debian package for Zitat, built by scripts/package-deb.sh, which sets the
# environment variables below and stages the publish output in
# artifacts/deb-root. nfpm does not expand environment variables in contents.
name: zitat
arch: ${ZITAT_DEB_ARCH}
platform: linux
version: ${ZITAT_VERSION}
version_schema: none
section: misc
maintainer: Ori Livneh <ori.livneh@gmail.com>
description: |
  web interface and HTTP API for systemd journals
  Search and browse systemd journal files through a web interface or HTTP API.
  Reads local journals and journals collected by systemd-journal-remote.
homepage: https://github.com/atdt/zitat
license: MIT
depends:
  - systemd
  - init-system-helpers (>= 1.54)
  - libc6 (>= 2.34)
  - libstdc++6
  - libgcc-s1

contents:
  - src: artifacts/deb-root/usr/lib/zitat
    dst: /usr/lib/zitat
    type: tree
  - src: deploy/zitat.service
    dst: /usr/lib/systemd/system/zitat.service
  - src: deploy/zitat.default
    dst: /etc/default/zitat
    type: config
  - src: artifacts/deb-root/usr/share/doc/zitat
    dst: /usr/share/doc/zitat
    type: tree
  - src: deploy/debian/lintian-overrides
    dst: /usr/share/lintian/overrides/zitat

scripts:
  postinstall: deploy/debian/postinst
  preremove: deploy/debian/prerm
  postremove: deploy/debian/postrm
